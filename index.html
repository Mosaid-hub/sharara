
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101820">
<title>Generator Lab</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f3f5f7;color:#17212b}
header{background:#101820;color:#fff;padding:25px 16px;text-align:center}
.brand{font-size:30px;font-weight:bold;direction:ltr}
main{max-width:950px;margin:auto;padding:24px 16px}
.hidden{display:none!important}
button{font-family:inherit;cursor:pointer}
.home{min-height:65vh;display:flex;align-items:center;justify-content:center}
.entry{width:100%;max-width:330px;min-height:270px;border:1px solid #d5dce2;border-radius:24px;background:#fff;color:#17212b;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px}
.entry-icon{width:120px;height:120px;border-radius:26px;background:#193f50;color:#78d9e7;display:flex;align-items:center;justify-content:center;font-size:64px}
.entry-name{font-size:25px;font-weight:bold}
.topline{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.back{border:0;border-radius:10px;background:#e1e7eb;padding:12px 16px;font-size:16px;color:#17212b}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:22px}
.card{min-height:145px;padding:14px 8px;border:1px solid #d5dce2;border-radius:16px;background:#fff;color:#17212b;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:11px;text-align:center}
.card-icon{font-size:34px}
.card-ar{font-weight:bold;font-size:16px}
.card-en{font-size:12px;color:#687681;direction:ltr}
#status{margin-top:18px;color:#a12b2b;line-height:1.7}
.details{margin-top:20px;padding:20px;background:#fff;border:1px solid #d5dce2;border-radius:16px;line-height:1.9;overflow-wrap:anywhere}
.details h2{margin-top:0}
.details h3{margin-bottom:4px}
.details p{margin-top:0;white-space:pre-wrap}
@media(min-width:600px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
</style>
</head>

<body>
<header>
  <div class="brand">Generator Lab</div>
</header>

<main>
  <section id="home" class="home">
    <button class="entry" id="openLibrary" type="button">
      <span class="entry-icon" aria-hidden="true">▦</span>
      <span class="entry-name">مكونات المولد</span>
    </button>
  </section>

  <section id="library" class="hidden">
    <div class="topline">
      <h2>مكونات المولد</h2>
      <button class="back" id="backHome" type="button">الرئيسية</button>
    </div>
    <div id="status" role="status"></div>
    <div id="componentGrid" class="grid"></div>
  </section>

  <section id="detail" class="hidden">
    <div class="topline">
      <h2>تفاصيل المكوّن</h2>
      <button class="back" id="backLibrary" type="button">رجوع للمكونات</button>
    </div>
    <article id="detailContent" class="details"></article>
  </section>
</main>

<script src="./components.js"></script>
<script>
"use strict";

const home = document.getElementById("home");
const library = document.getElementById("library");
const detail = document.getElementById("detail");
const grid = document.getElementById("componentGrid");
const status = document.getElementById("status");
const detailContent = document.getElementById("detailContent");

function showSection(section){
  [home, library, detail].forEach(el => el.classList.add("hidden"));
  section.classList.remove("hidden");
  window.scrollTo(0, 0);
}

function safe(value){
  return String(value ?? "").replace(/[&<>"']/g, ch => ({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  })[ch]);
}

function renderLibrary(){
  const items = Array.isArray(window.COMPONENTS)
    ? window.COMPONENTS
    : [];

  grid.replaceChildren();
  status.textContent = "";

  if(items.length === 0){
    status.textContent =
      "بيانات المكونات غير متاحة. تأكد من حفظ ملف components.js في نفس مكان index.html.";
    return;
  }

  items.forEach(item => {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "card";

    const icon = document.createElement("span");
    icon.className = "card-icon";
    icon.textContent = item.icon || "⚙️";

    const nameAr = document.createElement("span");
    nameAr.className = "card-ar";
    nameAr.textContent = item.nameAr || "مكوّن";

    const nameEn = document.createElement("span");
    nameEn.className = "card-en";
    nameEn.dir = "ltr";
    nameEn.textContent = item.nameEn || "";

    button.append(icon, nameAr, nameEn);
    button.addEventListener("click", () => showDetails(item));
    grid.appendChild(button);
  });
}

function showDetails(item){
  detailContent.replaceChildren();

  const title = document.createElement("h2");
  title.textContent = item.nameAr || "مكوّن";
  detailContent.appendChild(title);

  const englishName = document.createElement("p");
  englishName.dir = "ltr";
  englishName.textContent = item.nameEn || "";
  detailContent.appendChild(englishName);

  const fields = [
    ["الوظيفة", item.function],
    ["طريقة العمل", item.operation],
    ["الفحص", item.testing],
    ["ملاحظات", item.notes]
  ];

  fields.forEach(([label, value]) => {
    const heading = document.createElement("h3");
    heading.textContent = label;

    const paragraph = document.createElement("p");
    paragraph.textContent = value || "لم تُضف البيانات بعد.";

    detailContent.append(heading, paragraph);
  });

  showSection(detail);
}

document.getElementById("openLibrary").addEventListener("click", () => {
  renderLibrary();
  showSection(library);
});

document.getElementById("backHome").addEventListener("click", () => {
  showSection(home);
});

document.getElementById("backLibrary").addEventListener("click", () => {
  renderLibrary();
  showSection(library);
});
</script>
</body>
</html>
