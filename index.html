<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>كتاب شرارة - تعلم تفاعلي</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;background:#080a0f;color:#fff;font-family:'Tajawal',system-ui;overflow-x:hidden}
#login{position:fixed;inset:0;background:radial-gradient(ellipse at top,#1a1d2e 0%,#080a0f 60%);display:flex;align-items:center;justify-content:center;z-index:99999;padding:20px}
#loginBox{background:rgba(26,29,36,0.9);backdrop-filter:blur(20px);padding:28px;border-radius:24px;width:100%;max-width:380px;text-align:center;border:1px solid rgba(255,255,255,0.08);box-shadow:0 20px 60px rgba(0,0,0,0.5)}
input,button{width:100%;padding:14px 16px;border-radius:14px;border:1px solid rgba(255,255,255,0.1);background:rgba(0,0,0,0.3);color:#fff;margin:8px 0;font-size:15px;font-family:'Tajawal';transition:0.2s}
input:focus{border-color:#6c5ce7;outline:none;background:rgba(0,0,0,0.5)}
button{background:linear-gradient(135deg,#6c5ce7,#4f7cff);border:0;font-weight:800;cursor:pointer;letter-spacing:0.3px}
button:active{transform:scale(0.98)}
#book{display:none;min-height:100vh;background:radial-gradient(ellipse at top,#151a2a 0%,#080a0f 70%);padding:0 0 100px}
.topBar{position:sticky;top:0;z-index:100;background:rgba(10,12,18,0.85);backdrop-filter:blur(20px);padding:12px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(255,255,255,0.06)}
.page{position:relative;width:100%;max-width:760px;margin:28px auto;background:#ffffff;border-radius:20px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,0.4),0 1px 0 rgba(255,255,255,0.1) inset;color:#000;transform:translateZ(0)}
.pageTitle{background:linear-gradient(135deg,#0f111a,#1e2435);color:#fff;padding:16px 22px;font-weight:800;font-size:15px;display:flex;justify-content:space-between;align-items:center;letter-spacing:0.3px}
.pageNum{background:rgba(108,92,231,0.25);border:1px solid rgba(108,92,231,0.3);padding:5px 12px;border-radius:20px;font-size:12px;font-weight:700;color:#a29bfe}
.pageContent{position:relative;width:100%;min-height:720px;background:linear-gradient(180deg,#ffffff 0%,#fcfcfd 100%);overflow:hidden}
.block{position:absolute;border-radius:14px;transition:transform 0.2s,box-shadow 0.2s}
.block:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,0.12);z-index:10}
.block.text-block{padding:14px 16px;background:linear-gradient(135deg,#f8f9ff,#ffffff);border:1px solid #eef0ff;font-size:19px;line-height:1.8;color:#111;white-space:pre-wrap;word-break:break-word;box-shadow:0 2px 12px rgba(108,92,231,0.06)}
.block.image-block{box-shadow:0 4px 20px rgba(0,0,0,0.08);border:1px solid #f0f0f0;overflow:hidden}
.block.image-block img{width:100%;height:100%;object-fit:contain;display:block;background:#fafafb}
.block.video-block{box-shadow:0 8px 28px rgba(0,0,0,0.15);border:1px solid #111;overflow:hidden}
.block.video-block video{width:100%;height:100%;object-fit:contain;background:#000}
.block.model-block{box-shadow:0 8px 28px rgba(108,92,231,0.15);border:1px solid #e8e6ff;overflow:hidden}
.block.model-block model-viewer{width:100%;height:100%;background:radial-gradient(ellipse,#f5f3ff,#eee8ff)}
.block-desc{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(0deg,rgba(0,0,0,0.85),rgba(0,0,0,0));color:#fff;font-size:11px;padding:14px 10px 8px;white-space:pre-wrap;line-height:1.4}
#watermark{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:linear-gradient(135deg,rgba(108,92,231,0.9),rgba(79,124,255,0.9));color:#fff;padding:9px 22px;border-radius:24px;font-size:13px;font-weight:800;z-index:9999;pointer-events:none;letter-spacing:0.8px;backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,0.2);box-shadow:0 8px 24px rgba(108,92,231,0.4)}
#fsModal{display:none;position:fixed;inset:0;background:radial-gradient(ellipse at center,rgba(20,22,35,0.98),rgba(0,0,0,0.98));z-index:20000;align-items:center;justify-content:center;flex-direction:column;padding:10px;backdrop-filter:blur(10px)}
#fsModal.show{display:flex}
#fsContent{width:98%;height:92%;display:flex;align-items:center;justify-content:center;flex-direction:column}
#status{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:linear-gradient(135deg,#00c853,#00e676);color:#fff;padding:12px 24px;border-radius:24px;display:none;z-index:10000;box-shadow:0 8px 24px rgba(0,200,83,0.4);font-weight:700}
.progressDots{position:fixed;right:12px;top:50%;transform:translateY(-50%);z-index:50;display:flex;flex-direction:column;gap:8px}
.dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,0.2);transition:0.3s;cursor:pointer}
.dot.active{background:#6c5ce7;box-shadow:0 0 10px #6c5ce7;height:24px;border-radius:10px}
</style>
</head>
<body>
<div id="status"></div>
<div id="watermark" style="display:none">شرارة ✨</div>
<div class="progressDots" id="dots" style="display:none"></div>
<div id="fsModal"><button onclick="document.getElementById('fsModal').classList.remove('show')" style="position:absolute;top:16px;right:16px;background:rgba(255,255,255,0.1);backdrop-filter:blur(10px);color:#fff;border:1px solid rgba(255,255,255,0.1);padding:10px 18px;border-radius:12px;z-index:1;font-weight:700">✖</button><div id="fsContent"></div></div>

<div id="login"><div id="loginBox">
<div style="width:64px;height:64px;background:linear-gradient(135deg,#6c5ce7,#4f7cff);border-radius:18px;margin:0 auto 14px;display:flex;align-items:center;justify-content:center;font-size:32px;box-shadow:0 8px 24px rgba(108,92,231,0.4)">📚</div>
<h2 style="margin:0 0 6px;font-size:26px;font-weight:800">كتاب شرارة</h2>
<p style="color:#8b8fa3;font-size:13px;margin:0 0 22px">تعلم تفاعلي • صور • فيديو • 3D</p>
<div id="loginMode">
<input id="email" type="email" placeholder="ايميلك المسجل">
<input id="loginPass" type="password" placeholder="الباسورد">
<button id="loginBtn" style="margin-top:14px">دخول الكتاب 🚀</button>
<p style="margin:16px 0 0"><button onclick="showReg()" style="background:rgba(255,255,255,0.06);color:#8b8fa3;font-size:13px;padding:10px;border:1px solid rgba(255,255,255,0.06)">مستخدم جديد؟ سجل الآن</button></p>
</div>
<div id="regMode" style="display:none">
<input id="regName" type="text" placeholder="اسمك الكامل">
<input id="regEmail" type="email" placeholder="ايميلك">
<input id="regPass" type="password" placeholder="باسورد (4 حروف على الأقل)">
<button id="regBtn" style="margin-top:14px">إرسال طلب التسجيل 📩</button>
<p style="margin:16px 0 0"><button onclick="showLogin()" style="background:rgba(255,255,255,0.06);color:#8b8fa3;font-size:13px;padding:10px;border:1px solid rgba(255,255,255,0.06)">عندك حساب؟ ادخل</button></p>
</div>
<p id="loginErr" style="color:#ff6b6b;font-size:13px;display:none;margin:14px 0;background:rgba(255,107,107,0.1);padding:12px;border-radius:10px;border:1px solid rgba(255,107,107,0.2)"></p>
<p id="loginOk" style="color:#51cf66;font-size:13px;display:none;margin:14px 0;background:rgba(81,207,102,0.1);padding:12px;border-radius:10px;border:1px solid rgba(81,207,102,0.2)"></p>
</div></div>

<div id="book">
<div class="topBar" id="topBar" style="display:none"><span style="font-weight:800">📚 شرارة</span><span id="pageIndicator" style="font-size:12px;color:#8b8fa3">0 صفحة</span></div>
<div id="bookPages"></div>
</div>

<script>
var supa=null;
var pages=[];
function getDeviceId(){
 var id=localStorage.getItem('sharara_device_id');
 if(!id){
  id='dev_'+Date.now()+'_'+Math.random().toString(36).substr(2,9);
  localStorage.setItem('sharara_device_id',id);
 }
 return id;
}
function getDeviceInfo(){
 return (navigator.userAgent||'').substr(0,100);
}

function toast(m){var s=document.getElementById('status');s.textContent=m;s.style.display='block';setTimeout(()=>s.style.display='none',3000)}
function showReg(){ document.getElementById('loginMode').style.display='none'; document.getElementById('regMode').style.display='block'; hideMsgs(); }
function showLogin(){ document.getElementById('regMode').style.display='none'; document.getElementById('loginMode').style.display='block'; hideMsgs(); }
function hideMsgs(){ document.getElementById('loginErr').style.display='none'; document.getElementById('loginOk').style.display='none'; }

async function initSupa(){
 if(supa) return supa;
 var sc=document.createElement('script');
 sc.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js';
 await new Promise((res,rej)=>{ sc.onload=res; sc.onerror=rej; document.head.appendChild(sc); });
 supa=supabase.createClient('https://orxinctkhfadvoqoakxy.supabase.co','sb_publishable_OHc4faE-1i5zpL9HgUCf8Q_z5fv2b6g');
 return supa;
}

document.getElementById('regBtn').onclick=async function(){
 var name=document.getElementById('regName').value.trim();
 var email=document.getElementById('regEmail').value.trim().toLowerCase();
 var pass=document.getElementById('regPass').value.trim();
 var err=document.getElementById('loginErr');
 var ok=document.getElementById('loginOk');
 hideMsgs();
 if(!name||!email||!pass){ err.textContent='اكتب الاسم والإيميل والباسورد'; err.style.display='block'; return; }
 if(pass.length<4){ err.textContent='الباسورد قصير (4 حروف على الأقل)'; err.style.display='block'; return; }
 this.textContent='جاري الإرسال...'; this.disabled=true;
 try{
  await initSupa();
  var chk=await supa.from('students').select('id,status').ilike('email',email).limit(1);
  if(chk.data&&chk.data.length>0){ err.textContent='الإيميل ده مسجل قبل كده. حالته: '+chk.data[0].status; err.style.display='block'; return; }
  var ins=await supa.from('students').insert({name:name,email:email,password:pass,status:'pending'});
  if(ins.error) throw ins.error;
  ok.textContent='تم إرسال طلبك ✅ استنى موافقة المعلم'; ok.style.display='block';
  document.getElementById('regName').value=''; document.getElementById('regEmail').value=''; document.getElementById('regPass').value='';
  setTimeout(showLogin,2500);
 }catch(e){ err.textContent='خطأ: '+(e.message||e); err.style.display='block'; }
 finally{ this.textContent='إرسال طلب التسجيل 📩'; this.disabled=false; }
};

document.getElementById('loginBtn').onclick=async function(){
 var email=document.getElementById('email').value.trim().toLowerCase();
 var loginPass=document.getElementById('loginPass').value.trim();
 var err=document.getElementById('loginErr');
 hideMsgs();
 if(!email){ err.textContent='اكتب الإيميل'; err.style.display='block'; return; }
 if(!loginPass){ err.textContent='اكتب الباسورد'; err.style.display='block'; return; }
 this.textContent='جاري الدخول...'; this.disabled=true;
 try{
  await initSupa();
  var res=await supa.from('students').select('*').ilike('email',email).limit(1);
  if(res.error) throw res.error;
  if(!res.data||res.data.length===0){ err.textContent='الإيميل مش مسجل. سجل أولا'; err.style.display='block'; return; }
  var stu=res.data[0];
  if(stu.password && stu.password!==loginPass){ err.textContent='الباسورد غلط'; err.style.display='block'; return; }
  if(stu.status==='pending'){ err.textContent='⏳ حسابك لسه قيد المراجعة'; err.style.display='block'; return; }
  if(stu.status==='blocked'){ err.textContent='🚫 حسابك محظور'; err.style.display='block'; return; }
  if(stu.status!=='approved'){ err.textContent='غير مفعل: '+stu.status; err.style.display='block'; return; }
  
  // حماية الجهاز الواحد
  var myDeviceId=getDeviceId();
  if(!stu.device_id || stu.device_id===''){
   // أول دخول - اربط الجهاز
   var upd=await supa.from('students').update({device_id:myDeviceId}).eq('id',stu.id);
   if(upd.error){ console.warn('device bind failed',upd.error); }
   toast('تم ربط حسابك بهذا الجهاز 🔒');
  }else if(stu.device_id!==myDeviceId){
   // جهاز مختلف
   err.innerHTML='🔒 الحساب مربوط بجهاز آخر<br><small style="font-size:11px">تواصل مع المعلم لنقل الجهاز<br>كود جهازك: '+myDeviceId.substr(0,12)+'</small>';
   err.style.display='block';
   return;
  }
  
  toast('أهلا '+stu.name+' ✨');
  document.getElementById('login').style.display='none';
  document.getElementById('book').style.display='block';
  document.getElementById('topBar').style.display='flex';
  document.getElementById('watermark').style.display='block';
  document.getElementById('dots').style.display='flex';
  await loadBook();
 }catch(e){ err.textContent='خطأ: '+(e.message||e); err.style.display='block'; }
 finally{ this.textContent='دخول الكتاب 🚀'; this.disabled=false; }
};

async function freshUrl(b){
 if(!b.path||!b.bucket) return b.url||'';
 if(!supa) return b.url||'';
 try{ var r=await supa.storage.from(b.bucket).createSignedUrl(b.path,3600); return r.data?.signedUrl||b.url||''; }catch(e){ return b.url||''; }
}

async function loadBook(){
 var container=document.getElementById('bookPages');
 container.innerHTML='<div style="text-align:center;padding:80px 20px;color:#8b8fa3"><div style="font-size:40px;margin-bottom:12px">📚</div>جاري تحميل الكتاب...</div>';
 try{
  var r=await supa.from('pages').select('*').order('id');
  if(r.error) throw r.error;
  pages=r.data||[];
  if(pages.length===0){ container.innerHTML='<div style="text-align:center;padding:80px;color:#8b8fa3">الكتاب فاضي لسه</div>'; return; }
  container.innerHTML='';
  var dots=document.getElementById('dots'); dots.innerHTML='';
  pages.forEach((_,idx)=>{ var d=document.createElement('div'); d.className='dot'+(idx===0?' active':''); d.onclick=()=>{ document.getElementById('page-'+idx)?.scrollIntoView({behavior:'smooth'}); }; dots.appendChild(d); });
  document.getElementById('pageIndicator').textContent=pages.length+' صفحة';

  var md=document.createElement('script'); md.type='module'; md.src='https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js'; document.head.appendChild(md);
  
  for(var pIdx=0;pIdx<pages.length;pIdx++){
   var p=pages[pIdx];
   var pageDiv=document.createElement('div'); pageDiv.className='page'; pageDiv.id='page-'+pIdx;
   var titleDiv=document.createElement('div'); titleDiv.className='pageTitle';
   titleDiv.innerHTML='<span>📄 '+(p.name||('صفحة '+(pIdx+1)))+'</span><span class="pageNum">'+(pIdx+1)+' / '+pages.length+'</span>';
   var content=document.createElement('div'); content.className='pageContent';
   pageDiv.appendChild(titleDiv); pageDiv.appendChild(content); container.appendChild(pageDiv);
   
   var blocks=p.blocks||[];
   var maxBottom=650;
   blocks.forEach(bb=>{ var bot=(bb.y||0)+(bb.h||120); if(bot>maxBottom) maxBottom=bot; });
   content.style.minHeight=(maxBottom+30)+'px';
   
   for(var i=0;i<blocks.length;i++){
    var b=blocks[i];
    var url=b.url;
    if(b.path&&b.bucket){ url=await freshUrl(b); b.url=url; }
    var el=document.createElement('div');
    var descHtml = b.desc ? '<div class="block-desc">'+b.desc+'</div>' : '';
    
    if(b.type==='text'){
     el.className='block text-block';
     el.style.left=(b.x||0)+'px'; el.style.top=(b.y||0)+'px';
     el.style.width=(b.w||240)+'px'; el.style.height=(b.h||80)+'px';
     el.style.color=b.color||'#111';
     el.style.fontSize=(b.fontSize||19)+'px';
     el.innerHTML='<div style="width:100%;height:100%;overflow:auto;white-space:pre-wrap">'+(b.text||'')+'</div>'+descHtml;
    }else if(b.type==='image'&&url){
     el.className='block image-block';
     el.style.left=(b.x||0)+'px'; el.style.top=(b.y||0)+'px';
     el.style.width=(b.w||280)+'px'; el.style.height=(b.h||180)+'px';
     el.innerHTML='<img src="'+url+'" loading="lazy">'+descHtml;
    }else if(b.type==='video'&&url){
     el.className='block video-block';
     el.style.left=(b.x||0)+'px'; el.style.top=(b.y||0)+'px';
     el.style.width=(b.w||300)+'px'; el.style.height=(b.h||200)+'px';
     el.innerHTML='<video src="'+url+'" controls playsinline preload="metadata"></video>'+descHtml;
    }else if(b.type==='model'&&url){
     el.className='block model-block';
     el.style.left=(b.x||0)+'px'; el.style.top=(b.y||0)+'px';
     el.style.width=(b.w||300)+'px'; el.style.height=(b.h||220)+'px';
     el.innerHTML='<model-viewer src="'+url+'" camera-controls auto-rotate ar></model-viewer>'+descHtml;
    }else continue;
    
    // زر تكبير ثابت لكل بلوك
    var fsBtn=document.createElement('div');
    fsBtn.innerHTML='⛶';
    fsBtn.style.cssText='position:absolute;top:6px;left:6px;background:rgba(0,0,0,0.7);color:#fff;width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;cursor:pointer;z-index:5;backdrop-filter:blur(4px)';
    fsBtn.onclick=function(e){ e.stopPropagation(); openFS(b); };
    el.appendChild(fsBtn);
    
    (function(block, elem){
     elem.addEventListener('dblclick', function(){ openFS(block); });
     elem.addEventListener('click', function(e){ if(e.target===elem || e.target.tagName==='IMG' || e.target.tagName==='VIDEO') { /* single click no fullscreen to avoid accidental */ } });
     var pt; 
     elem.addEventListener('touchstart', function(){ pt=setTimeout(()=>openFS(block),700); },{passive:true});
     elem.addEventListener('touchend', function(){ clearTimeout(pt); });
     elem.addEventListener('touchmove', function(){ clearTimeout(pt); });
    })(b, el);
    content.appendChild(el);
   }
  }
  // scroll spy for dots
  var observer=new IntersectionObserver((entries)=>{
   entries.forEach(entry=>{
    if(entry.isIntersecting){
     var idx=parseInt(entry.target.id.split('-')[1]);
     document.querySelectorAll('.dot').forEach((d,i)=>{ d.classList.toggle('active',i===idx); });
    }
   });
  },{threshold:0.5});
  document.querySelectorAll('.page').forEach(p=>observer.observe(p));
  
  var end=document.createElement('div'); end.style.textAlign='center'; end.style.padding='60px 20px'; end.style.color='#8b8fa3'; end.innerHTML='<div style="width:48px;height:48px;background:linear-gradient(135deg,#6c5ce7,#4f7cff);border-radius:14px;margin:0 auto 12px;display:flex;align-items:center;justify-content:center">✨</div>نهاية الكتاب<br><small style="color:#6c5ce7;font-weight:700">شرارة - تعلم تفاعلي</small>'; container.appendChild(end);
 }catch(e){ container.innerHTML='<div style="text-align:center;padding:60px;color:#ff6b6b">خطأ: '+e.message+'</div>'; }
}

async function openFS(b){
 var m=document.getElementById('fsModal'); var c=document.getElementById('fsContent');
 m.classList.add('show');
 c.innerHTML='<div style="color:#fff;padding:20px">جاري التحميل...</div>';
 var url=b.url||'';
 if(b.path&&b.bucket){
  var fresh=await freshUrl(b);
  if(fresh) url=fresh;
  b.url=url;
 }
 var desc = b.desc ? '<div style="background:rgba(255,255,255,0.08);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.1);color:#fff;padding:14px 18px;border-radius:12px;margin-top:14px;max-width:90%;text-align:center;white-space:pre-wrap;font-size:14px">'+b.desc+'</div>' : '';
 if(b.type==='text'){
  c.innerHTML='<div style="background:#fff;color:#111;padding:28px;border-radius:20px;max-width:90%;max-height:85vh;overflow:auto;font-size:22px;line-height:1.8;white-space:pre-wrap;box-shadow:0 20px 60px rgba(0,0,0,0.5)">'+(b.text||'')+desc+'</div>';
 }else if(b.type==='image'&&url){
  c.innerHTML='<div style="display:flex;flex-direction:column;align-items:center"><img src="'+url+'" style="max-width:95vw;max-height:80vh;border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,0.5);object-fit:contain">'+desc+'</div>';
 }else if(b.type==='video'&&url){
  c.innerHTML='<div style="display:flex;flex-direction:column;align-items:center;width:100%"><video src="'+url+'" controls autoplay playsinline style="width:100%;max-width:95vw;max-height:82vh;border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,0.5)"></video>'+desc+'</div>';
 }else if(b.type==='model'&&url){
  c.innerHTML='<div style="display:flex;flex-direction:column;align-items:center;width:100%;height:100%"><model-viewer src="'+url+'" camera-controls auto-rotate ar style="width:100%;height:82%;min-height:400px;background:radial-gradient(ellipse,#1a1d2e,#0f1115);border-radius:20px"></model-viewer>'+desc+'</div>';
 }else{
  c.innerHTML='<div style="color:#fff;padding:20px">لا يوجد محتوى - الرابط منتهي<br><small>'+(b.path||'')+'</small></div>';
 }
}
</script>
</body>
</html>
